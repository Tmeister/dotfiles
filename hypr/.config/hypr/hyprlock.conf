# Hyprlock Configuration - macOS-inspired design
# Managed by dotfiles - protected from Omarchy updates

general {
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/images/lockscreen.jpg
    color = rgba(25, 20, 20, 1.0)

    blur_passes = 0
    blur_size = 2
    noise = 0
    contrast = 0
    brightness = 0
    vibrancy = 0
    vibrancy_darkness = 0.0
}

# =============================================================================
# DP-1 Monitor (Primary, scale 2.0 - larger fonts)
# =============================================================================

# Password input field - DP-1
input-field {
    monitor = DP-1
    size = 300, 30
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(242, 243, 244, 0)
    inner_color = rgba(242, 243, 244, 0)
    font_color = rgba(242, 243, 244, 0.75)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = rgba(204, 136, 34, 0)
    fail_color = rgba(204, 34, 34, 0)
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -468
    halign = center
    valign = center
}

# Time - DP-1
label {
    monitor = DP-1
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 140
    font_family = System Font
    position = 0, 310
    halign = center
    valign = center
}

# Date - DP-1
label {
    monitor = DP-1
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 32
    font_family = System Font
    position = 0, 430
    halign = center
    valign = center
}

# User name - DP-1
label {
    monitor = DP-1
    text = Tmeister
    color = rgba(242, 243, 244, 0.75)
    font_size = 20
    font_family = System Font
    position = 0, -407
    halign = center
    valign = center
}

# Hint text - DP-1
label {
    monitor = DP-1
    text = Touch ID or Enter Password
    color = rgba(242, 243, 244, 0.75)
    font_size = 16
    font_family = System Font
    position = 0, -445
    halign = center
    valign = center
}

# Profile image - DP-1
image {
    monitor = DP-1
    path = ~/.config/hypr/images/profile.png
    border_color = 0xffdddddd
    border_size = 0
    size = 80
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -340
    halign = center
    valign = center
}

# =============================================================================
# HDMI-A-1 Monitor (Secondary, scale 1.0 - smaller fonts)
