#
# Omarchy Override - Window Rules and Styling
# Custom window behaviors, workspace assignments, and visual styling
# Managed by dotfiles - changes here are preserved during omarchy updates
#
# UPDATED FOR HYPRLAND 0.53+ (v3 syntax)
# Format: windowrule = ACTION VALUE, match:FIELD PATTERN
#

# ============================================================================
# VICINAE LAUNCHER - Layer Rules
# ============================================================================

layerrule = blur on, match:namespace vicinae
layerrule = no_anim on, match:namespace vicinae

# ============================================================================
# WORKSPACE ASSIGNMENTS
# ============================================================================

# Communication apps -> Workspace 4 (Samsung monitor)
windowrule = workspace 4, match:class Slack
windowrule = workspace 4, match:class slack
windowrule = workspace 4, match:class discord
windowrule = workspace 4, match:class Discord

# Zen Browser -> Workspace 5
windowrule = workspace 5, match:class zen

# ============================================================================
# FILE DIALOG RULES
# ============================================================================

windowrule = float on, match:title (Open File.*)
windowrule = float on, match:title (Save File.*)
windowrule = float on, match:title (Save As.*)
windowrule = float on, match:title (Choose Files.*)
windowrule = float on, match:title (Select Folder.*)

# ============================================================================
# APPLICATION-SPECIFIC FLOAT RULES
# ============================================================================

# 1Password
windowrule = float on, match:class 1Password
windowrule = float on, match:title (1Password.*)

# Settings/Preferences dialogs
windowrule = float on, match:title (Preferences.*)
windowrule = float on, match:title (Settings.*)
windowrule = float on, match:title (Configuration.*)
windowrule = float on, match:title (Options.*)

# Generic dialogs
windowrule = float on, match:class dialog
windowrule = float on, match:class Dialog
windowrule = float on, match:class popup
windowrule = float on, match:class Popup

# Developer tools
windowrule = float on, match:title (Extension: .*)
windowrule = float on, match:title (DevTools.*)
windowrule = float on, match:title (Developer Tools.*)

# Nautilus (GNOME Files)
windowrule = float on, match:class org.gnome.Nautilus

# System utilities
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class nm-applet
windowrule = float on, match:class nm-connection-editor

# Browser-specific
windowrule = float on, match:class firefox, match:title (Library.*)
windowrule = float on, match:class google-chrome, match:title (Task Manager.*)
windowrule = float on, match:class code, match:title (Quick Open.*)

# ============================================================================
# JETBRAINS / ANDROID STUDIO FIXES
# ============================================================================

# Fix for "win" prefixed helper windows (tooltips, autocomplete, etc.)
windowrule = no_initial_focus on, match:class ^(jetbrains-.*)$, match:title ^(win.*)$, match:float 1

# Disable mouse focus for JetBrains
windowrule = no_follow_mouse on, match:class ^(jetbrains-.*)$

# Fix for tab dragging (empty title window)
windowrule = tag +jetbrains-popup, match:class ^(jetbrains-.*)$, match:title ^()$, match:float 1
windowrule = center on, match:tag jetbrains-popup
windowrule = stay_focused on, match:tag jetbrains-popup
windowrule = border_size 0, match:tag jetbrains-popup

# Android Studio specific optimizations
windowrule = opacity 1 1, match:class jetbrains-studio

# JetBrains splash screen
windowrule = tag +jetbrains-splash, match:class ^(jetbrains-.*)$, match:title ^(splash)$, match:float 1
windowrule = center on, match:tag jetbrains-splash
windowrule = no_focus on, match:tag jetbrains-splash
windowrule = border_size 0, match:tag jetbrains-splash

# ============================================================================
# CUSTOM STYLING - Border and Decoration
# ============================================================================

general {
    col.active_border = rgba(ffffff1a)
    border_size = 1
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 1
    }
}
