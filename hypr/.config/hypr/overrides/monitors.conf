#
# Omarchy Override - Monitor Configuration
# Dual monitor setup with vertical arrangement
# Managed by dotfiles - changes here are preserved during omarchy updates
#

# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors: hyprctl monitors

# ============================================================================
# PRIMARY MONITOR - Samsung LU28R55 28" 4K
# ============================================================================

# Port: DP-1
# Resolution: 3840x2160 @ 60Hz
# Position: Top (0x0)
# Scale: 2.0x
monitor=DP-1,3840x2160@60,0x0,2.0

# ============================================================================
# SECONDARY MONITOR - Mini Monitor 13" (1600x900 for larger text)
# ============================================================================

# Port: HDMI-A-1
# Resolution: 1600x900 @ 60Hz
# Position: Below primary (0x1080)
#   Calculation: Samsung height / scale = 2160 / 2.0 = 1080px
# Scale: 1.0x (native resolution)
monitor=HDMI-A-1,1600x900@60,0x1080,1.0

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

# Global DPI scaling for GTK apps to match HiDPI
env = GDK_SCALE,2

# Fallback for any other connected monitors
monitor=,preferred,auto,2.0
